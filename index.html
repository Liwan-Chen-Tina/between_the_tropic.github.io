<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BETWEEN THE TROPICS | 热带浮生</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Modern Peranakan Pastel Theme */
        :root {
            --color-bg: #fbf9f6;
            --color-text: #4a5452; /* dark dusty sage */
            --color-mint: #b2d2c3;
            --color-dusty-blue: #9eb1c0;
            --color-coral: #f0a696;
            --color-carmine: #c86f72;
            --color-white: #ffffff;
        }

        body { 
            background-color: var(--color-bg); 
            color: var(--color-text);
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            scroll-behavior: smooth;
        }

        .title-font {
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        .section-padding { padding: 6rem 1rem; }
        
        .nav-blur { 
            background: rgba(251, 249, 246, 0.85); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(158, 177, 192, 0.2); 
        }

        /* Accents */
        .text-carmine { color: var(--color-carmine); }
        .text-coral { color: var(--color-coral); }
        .text-dusty-blue { color: var(--color-dusty-blue); }
        .text-mint { color: var(--color-mint); }
        
        .bg-mint { background-color: var(--color-mint); }
        .bg-coral { background-color: var(--color-coral); }
        .bg-dusty-blue { background-color: var(--color-dusty-blue); }

        .btn-primary { 
            background: linear-gradient(135deg, var(--color-coral), var(--color-carmine)); 
            color: white; 
            font-weight: 600; 
            letter-spacing: 1px;
            border-radius: 9999px;
            box-shadow: 0 8px 20px rgba(240, 166, 150, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(240, 166, 150, 0.4);
        }
        
        .btn-outline {
            border: 2px solid var(--color-dusty-blue);
            color: var(--color-text);
            font-weight: 600;
            border-radius: 9999px;
            transition: all 0.3s ease;
        }
        .btn-outline:hover {
            background-color: var(--color-dusty-blue);
            color: white;
        }

        .card-bg { 
            background: #ffffff; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.04); 
            border-radius: 24px;
            border: 1px solid rgba(178, 210, 195, 0.2);
            overflow: hidden;
            transition: transform 0.4s ease;
            display: flex;
            flex-direction: column;
        }
        .card-bg:hover {
            transform: translateY(-6px);
        }

        /* Mystery Box CSS Design */
        .mystery-box-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f4; /* soft backdrop */
            border-radius: 20px 20px 0 0;
            overflow: hidden;
        }
        .mystery-box-inner {
            width: 60%;
            height: 60%;
            background: linear-gradient(135deg, var(--color-white) 0%, var(--color-mint) 100%);
            border-radius: 24px;
            box-shadow: 
                inset -5px -5px 15px rgba(0,0,0,0.05), 
                inset 5px 5px 15px rgba(255,255,255,1), 
                10px 15px 25px rgba(158, 177, 192, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid rgba(255,255,255,0.9);
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
        }
        
        .mystery-box-inner::before {
            content: '?';
            font-size: 5rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            color: var(--color-dusty-blue);
            text-shadow: 2px 2px 5px rgba(0,0,0,0.08);
            transform: translateZ(20px);
        }

        /* Hover animation for boxes */
        .card-bg:hover .mystery-box-inner, .hover-box-trigger:hover .mystery-box-inner {
            transform: scale(1.05) rotateY(12deg) rotateX(8deg);
        }

        /* Box Color Variants */
        .box-coral { background: linear-gradient(135deg, var(--color-white) 0%, var(--color-coral) 100%); }
        .box-coral::before { color: var(--color-carmine); }

        .box-blue { background: linear-gradient(135deg, var(--color-white) 0%, var(--color-dusty-blue) 100%); }
        .box-blue::before { color: var(--color-white); }
        
        .box-carmine { background: linear-gradient(135deg, var(--color-coral) 0%, var(--color-carmine) 100%); border-color: rgba(255,255,255,0.4); }
        .box-carmine::before { color: var(--color-white); }

        .image-filter {
            filter: sepia(10%) contrast(95%) brightness(102%) saturate(110%);
        }

        .hero-h { height: 85vh; }
        
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            border-radius: 50%;
        }
    </style>
</head>
<body x-data="appData()" class="min-h-screen antialiased overflow-x-hidden relative">

    <div class="blob bg-mint w-96 h-96 top-0 left-0 -translate-x-1/2 -translate-y-1/2"></div>
    <div class="blob bg-coral w-[30rem] h-[30rem] top-1/3 right-0 translate-x-1/3"></div>
    <div class="blob bg-dusty-blue w-[40rem] h-[40rem] bottom-0 left-1/4 translate-y-1/3"></div>

    <!-- Hero Section -->

    <!-- 品牌故事 / Brand Story -->

    <!-- Footer -->
    <footer class="py-12 bg-white border-t border-mint/20 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h2 class="text-2xl title-font font-bold mb-6 tracking-widest text-dusty-blue uppercase" x-text="lang === 'en' ? 'BETWEEN THE TROPICS' : '热带浮生'"></h2>
            <p class="text-sm opacity-50" x-text="t.footerCopy"></p>
        </div>
    </footer>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('appData', () => ({
                lang: 'zh', // Default to zh
                translations: {
                    en: {
                        navStory: 'BRAND STORY',
                        navFeatures: 'SG FEATURES',
                        navBlindBox: 'BLIND BOXES',
                        navDaily: 'Daily Accessories',
                        navFestive: 'Festive Series',
                        navLimited: 'LIMITED EXHIBITION',
                        
                        heroBadge: 'SERIES 01 MYSTERY DROP',
                        heroTitle: 'BETWEEN<br>THE TROPICS',
                        heroSub: 'Unbox the essence of the Lion City. Every pastel box holds a unique piece of modern Peranakan romance and local memories.',
                        heroBtn: 'Start Unboxing',
                        heroFloat1: 'What\'s inside?',
                        heroFloat2: 'Nyonya Colors',
